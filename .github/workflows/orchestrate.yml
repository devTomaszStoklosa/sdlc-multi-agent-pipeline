name: Orchestrate

# The orchestrator of a run (plan 3.5), called from the demo repository on
# issue labels, issue comments, finished gates and manual dispatches. The
# filter job drops events of bots and strangers before the concurrency group,
# so they neither wait in the run's queue nor cancel the events waiting there.
# Only the decide job is in the group: a role job outside it does not block
# the events of the run for up to 45 minutes (plan 2.2). A workflow run starts
# at most two roles, because after the Planner and after `changes_requested`
# the Developer follows without any GitHub event.
#
# Only the role jobs, in the `agents` environment, get the Claude Code token,
# and only the session process receives it (plan 4). The Planner and the
# Developer run on Claude Code; the Reviewer stays a stub until P7. The
# Developer's job commits and pushes the session's work with the app token
# from its own git directory, outside the workspace (plan 3.4).
# Each job that writes gets a GitHub App token narrowed to its scope in
# src/orchestrator/scopes.ts, and every scope there names a permission,
# because a token request without any permission input inherits all
# permissions of the app.
on:
  workflow_call:
    inputs:
      pipeline-ref:
        description: Commit of this repository whose code the jobs run.
        required: true
        type: string
      app-client-id:
        description: Client ID of the pipeline's GitHub App.
        required: true
        type: string
      app-id:
        description: ID of the pipeline's GitHub App, the author of the state comment.
        required: true
        type: string
      gates-workflow:
        description: Name of the calling repository's gates workflow.
        required: false
        type: string
        default: Gates
    # The caller passes the Claude Code token by name, although it exists only
    # in the `agents` environment: an environment secret that the caller does
    # not pass is an empty string here.
    secrets:
      APP_PRIVATE_KEY:
        description: Private key of the pipeline's GitHub App.
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        description: The Claude Code token from the caller's `agents` environment.
        required: true

permissions:
  contents: read

env:
  SDLC_APP_ID: ${{ inputs.app-id }}
  SDLC_GATES_WORKFLOW: ${{ inputs.gates-workflow }}

jobs:
  filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.filter.outputs.proceed }}
      issue: ${{ steps.filter.outputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devTomaszStoklosa/sdlc-multi-agent-pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: pipeline
          persist-credentials: false
      - uses: ./pipeline/.github/actions/pipeline-setup
      - id: filter
        run: npm run --silent --prefix pipeline orchestrator -- filter

  decide:
    needs: filter
    if: needs.filter.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: sdlc-run-${{ needs.filter.outputs.issue }}
      cancel-in-progress: false
    # The workflow token only reads: labels and pull requests for the checks
    # of FR-4.28c, workflow runs for a manual dispatch.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      role: ${{ steps.decide.outputs.role }}
    env:
      ISSUE: ${{ needs.filter.outputs.issue }}
      SDLC_EVENTS_FILE: ${{ github.workspace }}/run-events/decide.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devTomaszStoklosa/sdlc-multi-agent-pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: pipeline
          persist-credentials: false
      - uses: ./pipeline/.github/actions/pipeline-setup
      - id: scope
        run: npm run --silent --prefix pipeline orchestrator -- scopes --role orchestrator
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: ${{ steps.scope.outputs.contents }}
          permission-issues: ${{ steps.scope.outputs.issues }}
          permission-pull-requests: ${{ steps.scope.outputs.pull-requests }}
          permission-checks: ${{ steps.scope.outputs.checks }}
      - id: decide
        env:
          SDLC_APP_TOKEN: ${{ steps.token.outputs.token }}
          SDLC_READ_TOKEN: ${{ github.token }}
        run: npm run --silent --prefix pipeline orchestrator -- decide --issue "$ISSUE"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-events-decide-${{ github.run_attempt }}
          path: ${{ github.workspace }}/run-events
          if-no-files-found: ignore

  role:
    needs: [filter, decide]
    if: needs.decide.outputs.role != ''
    runs-on: ubuntu-24.04
    # The stage itself ends with the run's time limit (NFR-11.5); this is
    # the limit of the job around it.
    timeout-minutes: 50
    environment: agents
    # The workflow token reads the logs of failed gates for the Developer
    # (FR-4.12).
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      output: ${{ steps.role.outputs.output }}
    env:
      ISSUE: ${{ needs.filter.outputs.issue }}
      ROLE: ${{ needs.decide.outputs.role }}
      SDLC_EVENTS_FILE: ${{ github.workspace }}/run-events/role.jsonl
      SDLC_WORKSPACE: ${{ github.workspace }}/workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devTomaszStoklosa/sdlc-multi-agent-pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: pipeline
          persist-credentials: false
      - uses: ./pipeline/.github/actions/pipeline-setup
      - uses: ./pipeline/.github/actions/agent-setup
      # The session reads the main branch of the calling repository, and the
      # Developer's job checks out the run's branch. The whole history lets
      # the job merge the main branch into it (FR-4.28b). The session files
      # stay outside this checkout, so the agent cannot change its own hooks
      # (plan 3.4).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false
      - run: echo "SDLC_SESSIONS_DIR=$RUNNER_TEMP/agent-sessions" >> "$GITHUB_ENV"
      - id: scope
        run: npm run --silent --prefix pipeline orchestrator -- scopes --role "$ROLE"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: ${{ steps.scope.outputs.contents }}
          permission-issues: ${{ steps.scope.outputs.issues }}
          permission-pull-requests: ${{ steps.scope.outputs.pull-requests }}
          permission-checks: ${{ steps.scope.outputs.checks }}
      - id: role
        env:
          SDLC_APP_TOKEN: ${{ steps.token.outputs.token }}
          SDLC_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          SDLC_READ_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm run --silent --prefix pipeline orchestrator -- role --issue "$ISSUE" --role "$ROLE"
      # Summaries of the sessions for the public log, never a transcript.
      - name: Summarize the sessions
        if: always()
        run: |
          shopt -s nullglob
          for dir in "$SDLC_SESSIONS_DIR"/*/; do
            echo "# Session: $(basename "$dir")"
            npm run --silent --prefix pipeline session-summary -- --result "$dir/result.json" --audit "$dir/audit/tool-calls.jsonl"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      # The files stay on the runner, but a token in them would mean that it
      # reached the model or the audit log.
      - name: Check the session files for the token
        if: always()
        run: |
          if [ -d "$SDLC_SESSIONS_DIR" ] && grep -rqE 'sk-ant-[A-Za-z0-9_-]{8,}' "$SDLC_SESSIONS_DIR"; then
            echo "::error::A Claude token shape appears in the session files."
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-events-role-${{ github.run_attempt }}
          path: ${{ github.workspace }}/run-events
          if-no-files-found: ignore

  # Runs also when the role job failed, which counts as an infrastructure
  # error of the stage, but not when a stop cancelled the workflow run.
  advance:
    needs: [filter, decide, role]
    if: ${{ !cancelled() && needs.decide.outputs.role != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      role: ${{ steps.advance.outputs.role }}
    env:
      ISSUE: ${{ needs.filter.outputs.issue }}
      SDLC_EVENTS_FILE: ${{ github.workspace }}/run-events/advance.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devTomaszStoklosa/sdlc-multi-agent-pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: pipeline
          persist-credentials: false
      - uses: ./pipeline/.github/actions/pipeline-setup
      - id: scope
        run: npm run --silent --prefix pipeline orchestrator -- scopes --role orchestrator
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: ${{ steps.scope.outputs.contents }}
          permission-issues: ${{ steps.scope.outputs.issues }}
          permission-pull-requests: ${{ steps.scope.outputs.pull-requests }}
          permission-checks: ${{ steps.scope.outputs.checks }}
      - id: advance
        env:
          SDLC_APP_TOKEN: ${{ steps.token.outputs.token }}
          SDLC_READ_TOKEN: ${{ github.token }}
          SDLC_ROLE_OUTPUT: ${{ needs.role.outputs.output }}
        run: npm run --silent --prefix pipeline orchestrator -- advance --issue "$ISSUE"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-events-advance-${{ github.run_attempt }}
          path: ${{ github.workspace }}/run-events
          if-no-files-found: ignore

  role-2:
    needs: [filter, advance]
    if: needs.advance.outputs.role != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: agents
    # The workflow token reads the logs of failed gates for the Developer
    # (FR-4.12).
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      output: ${{ steps.role.outputs.output }}
    env:
      ISSUE: ${{ needs.filter.outputs.issue }}
      ROLE: ${{ needs.advance.outputs.role }}
      SDLC_EVENTS_FILE: ${{ github.workspace }}/run-events/role-2.jsonl
      SDLC_WORKSPACE: ${{ github.workspace }}/workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devTomaszStoklosa/sdlc-multi-agent-pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: pipeline
          persist-credentials: false
      - uses: ./pipeline/.github/actions/pipeline-setup
      - uses: ./pipeline/.github/actions/agent-setup
      # The session reads the main branch of the calling repository, and the
      # Developer's job checks out the run's branch. The whole history lets
      # the job merge the main branch into it (FR-4.28b). The session files
      # stay outside this checkout, so the agent cannot change its own hooks
      # (plan 3.4).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false
      - run: echo "SDLC_SESSIONS_DIR=$RUNNER_TEMP/agent-sessions" >> "$GITHUB_ENV"
      - id: scope
        run: npm run --silent --prefix pipeline orchestrator -- scopes --role "$ROLE"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: ${{ steps.scope.outputs.contents }}
          permission-issues: ${{ steps.scope.outputs.issues }}
          permission-pull-requests: ${{ steps.scope.outputs.pull-requests }}
          permission-checks: ${{ steps.scope.outputs.checks }}
      - id: role
        env:
          SDLC_APP_TOKEN: ${{ steps.token.outputs.token }}
          SDLC_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          SDLC_READ_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm run --silent --prefix pipeline orchestrator -- role --issue "$ISSUE" --role "$ROLE"
      # Summaries of the sessions for the public log, never a transcript.
      - name: Summarize the sessions
        if: always()
        run: |
          shopt -s nullglob
          for dir in "$SDLC_SESSIONS_DIR"/*/; do
            echo "# Session: $(basename "$dir")"
            npm run --silent --prefix pipeline session-summary -- --result "$dir/result.json" --audit "$dir/audit/tool-calls.jsonl"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      # The files stay on the runner, but a token in them would mean that it
      # reached the model or the audit log.
      - name: Check the session files for the token
        if: always()
        run: |
          if [ -d "$SDLC_SESSIONS_DIR" ] && grep -rqE 'sk-ant-[A-Za-z0-9_-]{8,}' "$SDLC_SESSIONS_DIR"; then
            echo "::error::A Claude token shape appears in the session files."
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-events-role-2-${{ github.run_attempt }}
          path: ${{ github.workspace }}/run-events
          if-no-files-found: ignore

  advance-2:
    needs: [filter, advance, role-2]
    if: ${{ !cancelled() && needs.advance.outputs.role != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      ISSUE: ${{ needs.filter.outputs.issue }}
      SDLC_EVENTS_FILE: ${{ github.workspace }}/run-events/advance-2.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devTomaszStoklosa/sdlc-multi-agent-pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: pipeline
          persist-credentials: false
      - uses: ./pipeline/.github/actions/pipeline-setup
      - id: scope
        run: npm run --silent --prefix pipeline orchestrator -- scopes --role orchestrator
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: ${{ steps.scope.outputs.contents }}
          permission-issues: ${{ steps.scope.outputs.issues }}
          permission-pull-requests: ${{ steps.scope.outputs.pull-requests }}
          permission-checks: ${{ steps.scope.outputs.checks }}
      # A third role would need a third job; the Developer never hands over
      # without a GitHub event, so the advance job only records it.
      - env:
          SDLC_APP_TOKEN: ${{ steps.token.outputs.token }}
          SDLC_READ_TOKEN: ${{ github.token }}
          SDLC_ROLE_OUTPUT: ${{ needs.role-2.outputs.output }}
        run: npm run --silent --prefix pipeline orchestrator -- advance --issue "$ISSUE"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-events-advance-2-${{ github.run_attempt }}
          path: ${{ github.workspace }}/run-events
          if-no-files-found: ignore
